# This is copied from Cargokit (which is the official way to use it currently)
# Details: https://fzyzcjy.github.io/flutter_rust_bridge/manual/integrate/builtin

name: build_tool
description: Cargokit build_tool. Facilitates the build of Rust crate during Flutter application build.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0"

# Add regular dependencies here.
dependencies:
  # Build preparation refreshes dependencies before compiling the runner.
  logging: any
  path: any
  version: any
  collection: any
  ed25519_edwards: any
  hex: any
  yaml: any
  source_span: any
  github: any
  args: any
  crypto: any
  convert: any
  http: any
  toml: any

dev_dependencies:
  lints: any
  test: any
