name: Native Client

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Windows checks and unsigned Android artifacts
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 4
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust_preview
      - uses: actions/cache@v4
        with:
          path: |
            .local/jdk-21
            .local/android-sdk
            .local/downloads
          key: android-tools-${{ runner.os }}-${{ hashFiles('toolchains.json') }}
      - name: Refresh stable SDKs, dependencies and generated FFI
        run: |
          python scripts/prepare_build.py
          dart format --output=none --set-exit-if-changed lib test integration_test
          python -m unittest discover -s scripts/tests -v
      - name: Rust core
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
          python scripts/test_rust.py
          cargo fmt --manifest-path rust_preview/Cargo.toml -- --check
          cargo clippy --manifest-path rust_preview/Cargo.toml --all-targets --locked -- -D warnings
          python scripts/test_rust.py --manifest rust_preview/Cargo.toml
          python scripts/check_ios_cloud.py
      - name: Native packager toolchain regression
        working-directory: rust_builder/cargokit/build_tool
        run: |
          dart pub get
          dart test test/project_toolchain_test.dart
      - name: Flutter and real host FFI
        run: |
          flutter --no-version-check --suppress-analytics analyze
          flutter --no-version-check --suppress-analytics test
          python scripts/test_native.py
      - name: Isolated Android SDK and JDK
        run: python -u scripts/bootstrap_android.py --accept-licenses
      - name: SDK-free and opt-in Android push compilation
        run: python -u scripts/test_android_cloud.py
      - name: Build and verify unsigned APK and AAB
        run: python -u scripts/build_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/reports/android/*.json

  ios:
    name: macOS checks and unsigned ordinary/cloud iOS builds
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      COCOAPODS_DISABLE_STATS: 'true'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust_preview
      - name: Refresh stable SDKs, dependencies and verify host FFI
        run: |
          python scripts/prepare_build.py
          python -m unittest discover -s scripts/tests -v
          python scripts/check_ios_cloud.py
          python scripts/test_rust.py
          python scripts/test_native.py
      - name: Rust preview and real Swift C ABI
        run: |
          cargo fmt --manifest-path rust_preview/Cargo.toml -- --check
          cargo clippy --manifest-path rust_preview/Cargo.toml --all-targets --locked -- -D warnings
          python scripts/test_rust.py --manifest rust_preview/Cargo.toml
          python -u scripts/test_ios_cloud.py
      - name: Compile without distribution signing
        run: |
          python scripts/build_ios.py --compile-only
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-${{ github.sha }}
          if-no-files-found: error
          path: build/ios/iphoneos/Runner.app
      - name: Compile cloud flavor without distribution signing
        run: |
          python scripts/build_ios.py --compile-only --flavor cloud
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-cloud-${{ github.sha }}
          if-no-files-found: error
          path: build/ios/iphoneos/Runner.app
