name: Native Client

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the pubspec version to GitHub Releases after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Windows checks and Android artifacts
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 4
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            rust
            rust_preview
            third_party/bridge-p2p
      - name: Prepare P2P protobuf compiler
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from build_commands import environment; import os; value=environment(); open(os.environ['GITHUB_ENV'], 'a').write('PROTOC=' + value.get('PROTOC', 'protoc') + '\n')"
      - uses: actions/cache@v4
        with:
          path: |
            .local/jdk-21
            .local/android-sdk
            .local/downloads
          key: android-tools-${{ runner.os }}-${{ hashFiles('toolchains.json') }}
      - name: Verify reviewed dependencies and generated FFI
        run: |
          flutter --no-version-check --suppress-analytics --version
          bridge_codegen_version=$(python -c "import sys; sys.path.insert(0, 'scripts'); from check_toolchains import bridge_version; from pathlib import Path; print(bridge_version(Path.cwd()))")
          cargo install flutter_rust_bridge_codegen --version "$bridge_codegen_version" --locked
          python scripts/verify_build_snapshot.py
          dart format --output=none --set-exit-if-changed lib test integration_test
          python -m unittest discover -s scripts/tests -v
      - name: Rust core
        run: |
          cargo test --manifest-path third_party/bridge-p2p/Cargo.toml --lib --locked
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
          python scripts/test_rust.py
          cargo fmt --manifest-path rust_preview/Cargo.toml -- --check
          cargo clippy --manifest-path rust_preview/Cargo.toml --all-targets --locked -- -D warnings
          python scripts/test_rust.py --manifest rust_preview/Cargo.toml
          python scripts/check_ios_cloud.py
      - name: Native packager toolchain regression
        working-directory: rust_builder/cargokit/build_tool
        run: |
          dart pub get --enforce-lockfile
          dart test test/project_toolchain_test.dart test/compiled_kernel_test.dart
      - name: Flutter and real host FFI
        run: |
          flutter --no-version-check --suppress-analytics analyze
          flutter --no-version-check --suppress-analytics test
          python scripts/test_native.py
      - name: Package LGPL corresponding source
        run: python scripts/package_p2p_source.py
      - name: Isolated Android SDK and JDK
        run: python -u scripts/bootstrap_android.py --accept-licenses
      - name: SDK-free and opt-in Android push compilation
        run: python -u scripts/test_android_cloud.py
      - name: Build and verify APK and AAB
        env:
          BRIDGE_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
          BRIDGE_KEYSTORE_BASE64: ${{ secrets.BRIDGE_KEYSTORE_BASE64 }}
          BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.BRIDGE_KEYSTORE_PASSWORD }}
          BRIDGE_KEY_ALIAS: ${{ secrets.BRIDGE_KEY_ALIAS }}
          BRIDGE_KEY_PASSWORD: ${{ secrets.BRIDGE_KEY_PASSWORD }}
        run: python -u scripts/build_release_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/reports/android/*.json
            build/reports/build-snapshot.json
            build/release-assets/bridge-p2p-corresponding-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        with:
          name: release-android
          compression-level: 0
          if-no-files-found: error
          path: build/release-assets/*

  ios:
    name: macOS checks and unsigned ordinary/cloud iOS builds
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      CI: 'true'
      COCOAPODS_DISABLE_STATS: 'true'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - name: P2P protobuf compiler
        run: command -v protoc || brew install protobuf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            rust
            rust_preview
            third_party/bridge-p2p
      - name: Verify reviewed dependencies and host FFI
        run: |
          flutter --no-version-check --suppress-analytics --version
          bridge_codegen_version=$(python -c "import sys; sys.path.insert(0, 'scripts'); from check_toolchains import bridge_version; from pathlib import Path; print(bridge_version(Path.cwd()))")
          cargo install flutter_rust_bridge_codegen --version "$bridge_codegen_version" --locked
          python scripts/verify_build_snapshot.py
          python -m unittest discover -s scripts/tests -v
          python scripts/check_ios_cloud.py
          cargo test --manifest-path third_party/bridge-p2p/Cargo.toml --lib --locked
          python scripts/test_rust.py
          python scripts/test_native.py
      - name: Compile without distribution signing
        run: |
          python scripts/build_ios.py --compile-only
      - name: Package unsigned app and corresponding source for user signing
        run: |
          python scripts/package_release.py ios
          python scripts/package_p2p_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: ios-p2p-for-user-signing-${{ github.sha }}
          if-no-files-found: error
          path: build/release-assets/*
      - name: Package ordinary iOS app for user signing
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        run: python scripts/package_release.py ios
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        with:
          name: release-ios
          compression-level: 0
          if-no-files-found: error
          path: build/release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-${{ github.sha }}
          if-no-files-found: error
          path: build/ios/iphoneos/Runner.app
      - name: Compile cloud flavor without distribution signing
        run: |
          python scripts/build_ios.py --compile-only --flavor cloud
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-cloud-${{ github.sha }}
          if-no-files-found: error
          path: build/ios/iphoneos/Runner.app
      - name: Rust preview and real Swift C ABI
        if: ${{ !cancelled() }}
        run: |
          cargo fmt --manifest-path rust_preview/Cargo.toml -- --check
          cargo clippy --manifest-path rust_preview/Cargo.toml --all-targets --locked -- -D warnings
          python scripts/test_rust.py --manifest rust_preview/Cargo.toml
          python -u scripts/test_ios_cloud.py

  release:
    name: Publish APK and IPA
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release-assets
      - name: Validate release assets and checksums
        run: python scripts/package_release.py manifest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python scripts/package_release.py version)
          gh release create "$tag" --target "$GITHUB_SHA" --title "Bridge Mobile $tag" --notes-file "docs/releases/$tag.md" --draft
          gh release upload "$tag" build/release-assets/*
          gh release edit "$tag" --draft=false --latest
