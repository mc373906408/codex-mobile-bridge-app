[package]
name = "bridge_preview"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
anyhow = "*"
base64 = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
snow = "*"
url = "*"
uuid = { version = "*", features = ["serde"] }
zeroize = "*"

[target.'cfg(target_os = "android")'.dependencies]
jni = "*"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
