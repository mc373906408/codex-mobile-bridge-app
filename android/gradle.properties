org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental cache cannot relativize Pub sources on a different Windows drive.
kotlin.incremental=false
# Use the packaged QR model, not a Google Play Services model download.
dev.steenbakker.mobile_scanner.useUnbundled=false
# The pinned Flutter plugin otherwise resets our explicit target-platform ABI filters.
disable-abi-filtering=true
