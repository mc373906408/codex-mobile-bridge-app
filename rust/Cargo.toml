[package]
name = "bridge_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "*"
base64 = "*"
bridge_preview = { path = "../rust_preview" }
cookie = "*"
flutter_rust_bridge = "*"
futures-util = "*"
http = "*"
reqwest = { version = "*", features = ["json", "stream"] }
rusqlite = { version = "*", features = ["bundled"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sha2 = "*"
snow = "*"
zeroize = { version = "*", features = ["derive"] }
getrandom = "*"
tokio-tungstenite = { version = "*", features = ["rustls-tls-native-roots"] }
thiserror = "*"
tokio = { version = "*", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "*", features = ["rt"] }
url = "*"
uuid = { version = "*", features = ["v4", "serde"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "*"
rustls-platform-verifier = "*"

[dev-dependencies]
rcgen = "*"
tempfile = "*"
tokio-rustls = "*"
wiremock = "*"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
