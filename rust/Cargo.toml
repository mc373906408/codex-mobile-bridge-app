[package]
name = "bridge_native"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "*"
base64 = "*"
bridge_preview = { path = "../rust_preview" }
bridge-p2p = { path = "../third_party/bridge-p2p" }
cookie = "*"
flutter_rust_bridge = "*"
futures-util = "*"
http = "*"
reqwest = { version = "*", features = ["json", "stream"] }
rusqlite = { version = "*", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sha2 = "*"
snow = "*"
zeroize = { version = "*", features = ["derive"] }
getrandom = "*"
tokio-tungstenite = { version = "*", features = ["rustls-tls-native-roots"] }
thiserror = "*"
tokio = { version = "*", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "*", features = ["rt"] }
url = "*"
uuid = { version = "*", features = ["v4", "serde"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "*"

[dev-dependencies]
rcgen = "*"
tempfile = "*"
tokio-rustls = "*"
wiremock = "*"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[patch."https://github.com/easytier/thunk.git"]
thunk-rs = { path = "../third_party/bridge-p2p/vendor/thunk-rs" }

[patch.crates-io]
pnet_datalink = { path = "../third_party/bridge-p2p/vendor/pnet_datalink" }
netdev = { path = "../third_party/bridge-p2p/vendor/netdev" }
